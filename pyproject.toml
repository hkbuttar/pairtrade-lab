[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pairtrade-lab"
version = "0.1.0"
description = "Statistical arbitrage backtester: cointegration-based pair/basket selection, Kalman hedge ratios, structural-break monitoring, walk-forward validation."
requires-python = ">=3.11"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
